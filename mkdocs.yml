# TikTok Seller University (BR) - 镜像库
# 站點默認語言（pt-BR = 葡萄牙語巴西）

site_name: TikTok Shop Academy BR - Mirror
site_description: TikTok Seller University Brazil knowledge base mirror
site_url: https://kiva-9.github.io/tiktok-seller-university-mirror/
repo_url: https://github.com/kiva-9/tiktok-seller-university-mirror
repo_name: kiva-9/tiktok-seller-university-mirror

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang:
        - pt
        - en

# 自动生成目录导航（根据 docs/ 的文件夹结构）
# 留空 = MkDocs 自动扫描 docs/ 生成 nav
nav:
  - 首页: index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiva-9/tiktok-seller-university-mirror
  generator: true

# Markdown 扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

# 版权
copyright: Copyright &copy; 2026 TikTok Shop Academy Mirror
