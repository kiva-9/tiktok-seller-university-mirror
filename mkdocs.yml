# TikTok Seller University (BR) - 镜像库

site_name: TikTok Shop Academy BR - Mirror
site_description: Mirror of TikTok Seller University Brazil knowledge base
site_url: https://kiva-9.github.io/tiktok-seller-university-mirror/

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search:
      lang:
        - pt
        - en

# 自动生成目录导航（根据 docs/ 的文件夹结构）
nav:
  - Home: index.md
  - Cursos: cursos/
  - Feature Guide: feature-guide/
  - Policy Center: policy-center/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiva-9/tiktok-seller-university-mirror
