# TikTok Shop Academy BR - 镜像库

site_name: TikTok Shop Academy BR
site_description: TikTok Seller University Brazil knowledge base mirror
site_url: https://kiva-9.github.io/tiktok-seller-university-mirror/
repo_url: https://github.com/kiva-9/tiktok-seller-university-mirror
repo_name: kiva-9/tiktok-seller-university-mirror

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    # 白色背景 + 蓝色 accent（rspress 风格）
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - header.autohide

plugins:
  - search:
      lang: [en]

# 自动生成目录导航
nav:
  - 首页: index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiva-9/tiktok-seller-university-mirror
  analytics:
    provider: google
  generator: false

# Markdown 扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# 自定义 CSS（rspress 风格的卡片、间距、排版）
extra_css:
  - assets/custom.css

copyright: Copyright &copy; 2026 TikTok Shop Academy Mirror
